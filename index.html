    <script>
      (function() {
        function isResizeObserverNotice(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || (err.error && err.error.message) || '');
          return typeof msg === 'string' && (
            msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            msg.indexOf('ResizeObserver loop limit exceeded') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (isResizeObserverNotice(e)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isResizeObserverNotice(msg) || (error && isResizeObserverNotice(error))) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };
      })();
    </script>
